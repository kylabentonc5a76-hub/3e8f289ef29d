          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target webgpubindgroup -j2
      - run:
          name: Create bind group
          command: LIONSS_LP=1 ./build/webgpubindgroup --conf bg.cfg --layout auto

